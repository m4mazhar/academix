spring:
  application:
    name: edumerge

  profiles:
    active: dev

  # ── Jackson ─────────────────────────────────────────────────────
  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

  # ── JPA ─────────────────────────────────────────────────────────
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Thymeleaf ───────────────────────────────────────────────────
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # ── Multipart (file upload) ──────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # ── DevTools ────────────────────────────────────────────────────
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

# ── Server ──────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ── Logging ─────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.academix: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/edumerge.log

# ── Custom app settings ──────────────────────────────────────────────
app:
  center:
    name: Academix
  academic:
    year: 2026
  upload:
    dir: uploads/
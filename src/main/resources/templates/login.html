<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Academix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow-sm" style="width:400px">
    <div class="card-body p-4">
      <h5 class="fw-semibold mb-1">
        <i class="bi bi-mortarboard-fill text-primary"></i> Academix Login
      </h5>
      <p class="text-muted small mb-4">Coaching Center Management System</p>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <div th:if="${param.error}" class="alert alert-danger small">Invalid credentials.</div>
        <button type="submit" class="btn btn-primary w-100">Sign In</button>
      </form>
      <hr class="my-3">
      <p class="text-muted small mb-0"><strong>Demo:</strong> Username: <code>admin</code> · Password: <code>admin123</code></p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Branch Form</title></head>
<body>
<main>
  <div class="card border-0 shadow-sm" style="max-width:580px">
    <div class="card-header bg-white fw-semibold border-bottom">
      <i class="bi bi-building me-2"></i>
      <span th:text="${branch.id == null ? 'Create Branch' : 'Edit Branch'}"></span>
    </div>
    <div class="card-body p-4">
      <form th:action="${branch.id != null} ? @{/admin/branches/{id}/edit(id=${branch.id})} : @{/admin/branches/save}"
            th:object="${branch}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label">Branch Code *</label>
            <input type="text" th:field="*{branchCode}" class="form-control" required
                   placeholder="e.g. BR-02"
                   th:classappend="${#fields.hasErrors('branchCode')}?' is-invalid':''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('branchCode')}" th:errors="*{branchCode}"></div>
          </div>
          <div class="col-md-7">
            <label class="form-label">Branch Name *</label>
            <input type="text" th:field="*{branchName}" class="form-control" required
                   placeholder="e.g. Mirpur Branch"
                   th:classappend="${#fields.hasErrors('branchName')}?' is-invalid':''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('branchName')}" th:errors="*{branchName}"></div>
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="text" th:field="*{phone}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" th:field="*{email}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Manager Name</label>
            <input type="text" th:field="*{managerName}" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Opened Date</label>
            <input type="date" th:field="*{openedDate}" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select th:field="*{status}" class="form-select">
              <option th:each="s : ${T(com.academix.model.enums.BranchStatus).values()}"
                      th:value="${s}" th:text="${s}"></option>
            </select>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>Save Branch
          </button>
          <a href="/admin/branches" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

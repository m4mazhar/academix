<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Branch Users</title></head>
<body>
<main>
  <div class="d-flex align-items-center gap-2 mb-3">
    <a href="/admin/branches" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h5 class="mb-0">
      <i class="bi bi-people me-2"></i>Users —
      <span th:text="${branch.branchName}"></span>
      <small class="text-muted" th:text="'(' + ${branch.branchCode} + ')'"></small>
    </h5>
  </div>

  <div class="row g-3">
    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold small border-bottom">
          <i class="bi bi-person-plus me-1"></i>Assign User to Branch
        </div>
        <div class="card-body p-3">
          <form th:action="@{/admin/branches/{id}/users(id=${branch.id})}" method="post">
            <div class="mb-2">
              <label class="form-label small">User *</label>
              <select name="userId" class="form-select form-select-sm" required>
                <option value="">-- Select User --</option>
                <option th:each="u : ${allUsers}" th:value="${u.id}"
                        th:text="${u.fullName + ' (' + u.username + ')'}"></option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small">Role *</label>
              <select name="role" class="form-select form-select-sm" required>
                <option value="">-- Select Role --</option>
                <option th:each="r : ${T(com.academix.model.enums.BranchRole).values()}"
                        th:value="${r}" th:text="${r}"></option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-sm w-100">
              <i class="bi bi-person-check me-1"></i>Assign User
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-semibold small border-bottom">
          <i class="bi bi-people me-1"></i>Current Users
        </div>
        <div class="card-body p-0">
          <table class="table table-sm table-hover mb-0">
            <thead class="table-light">
              <tr><th>Username</th><th>Full Name</th><th>Role</th></tr>
            </thead>
            <tbody>
              <tr th:each="ubr : ${branchUsers}">
                <td th:text="${ubr.user.username}"></td>
                <td th:text="${ubr.user.fullName}"></td>
                <td>
                  <span class="badge"
                        th:classappend="${ubr.role.name()=='SUPER_ADMIN'}?'bg-danger':(${ubr.role.name()=='BRANCH_MANAGER'}?'bg-primary':(${ubr.role.name()=='ACCOUNTANT'}?'bg-info text-dark':'bg-secondary'))"
                        th:text="${ubr.role}"></span>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(branchUsers)}">
                <td colspan="3" class="text-center text-muted py-2">No users assigned to this branch.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>

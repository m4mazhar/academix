<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Branch Management</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-buildings me-2"></i>Branch Management</h5>
    <a href="/admin/branches/new" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg me-1"></i>Add Branch
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Code</th><th>Name</th><th>Address</th><th>Manager</th>
            <th>Phone</th><th>Status</th><th>Opened</th><th></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="b : ${branches}">
            <td><small class="text-muted fw-semibold" th:text="${b.branchCode}"></small></td>
            <td class="fw-semibold" th:text="${b.branchName}"></td>
            <td th:text="${b.address}"></td>
            <td th:text="${b.managerName}"></td>
            <td th:text="${b.phone}"></td>
            <td>
              <span class="badge"
                    th:classappend="${b.status.name()=='ACTIVE'}?'bg-success':'bg-secondary'"
                    th:text="${b.status}"></span>
            </td>
            <td th:text="${b.openedDate}"></td>
            <td class="text-end">
              <a th:href="@{/admin/branches/{id}/edit(id=${b.id})}" class="btn btn-sm btn-outline-primary me-1">Edit</a>
              <a th:href="@{/admin/branches/{id}/users(id=${b.id})}" class="btn btn-sm btn-outline-secondary">Users</a>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(branches)}">
            <td colspan="8" class="text-center text-muted py-3">No branches configured.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>

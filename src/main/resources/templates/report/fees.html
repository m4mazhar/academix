<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Fee Collection Report</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-coin me-2"></i>Fee Collection Report</h5>
    <div class="d-flex gap-1">
      <a href="/reports/fees/export?format=pdf" class="btn btn-sm btn-outline-danger">
        <i class="bi bi-file-earmark-pdf me-1"></i>PDF
      </a>
      <a href="/reports/fees/export?format=xlsx" class="btn btn-sm btn-outline-success">
        <i class="bi bi-file-earmark-excel me-1"></i>Excel
      </a>
      <a href="/reports" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>
  </div>

  <form th:action="@{/reports/fees}" method="get" class="row g-2 mb-3">
    <div class="col-md-2">
      <select name="month" class="form-select">
        <option value="0">All Months</option>
        <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}"
                th:text="${#calendars.format(#calendars.create(2000,m,1),'MMM')}"
                th:selected="${param.month != null && param.month[0] == m.toString()}"></option>
      </select>
    </div>
    <div class="col-md-2">
      <input type="number" name="year" class="form-control" placeholder="Year"
             th:value="${param.year}">
    </div>
    <div class="col-md-2">
      <button type="submit" class="btn btn-outline-secondary w-100">Filter</button>
    </div>
  </form>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Receipt#</th><th>Student</th><th>Batch</th>
            <th>Period</th><th>Amount</th><th>Mode</th><th>Status</th><th>Date</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="f : ${fees}">
            <td><small class="text-muted" th:text="${f.receiptNumber}"></small></td>
            <td th:text="${f.student.fullName}"></td>
            <td th:text="${f.batch != null ? f.batch.batchName : '—'}"></td>
            <td th:text="${f.month + '/' + f.year}"></td>
            <td class="fw-semibold" th:text="'৳ ' + ${f.amount}"></td>
            <td th:text="${f.paymentMode}"></td>
            <td>
              <span class="badge"
                    th:classappend="${f.status.name()=='PAID'}?'bg-success':(${f.status.name()=='PENDING'}?'bg-warning text-dark':'bg-danger')"
                    th:text="${f.status}"></span>
            </td>
            <td th:text="${f.paidDate}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(fees)}">
            <td colspan="8" class="text-center text-muted py-3">No records found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Student Report</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-people me-2"></i>Student Report</h5>
    <div class="d-flex gap-1">
      <a href="/reports/students/export?format=pdf" class="btn btn-sm btn-outline-danger">
        <i class="bi bi-file-earmark-pdf me-1"></i>PDF
      </a>
      <a href="/reports/students/export?format=xlsx" class="btn btn-sm btn-outline-success">
        <i class="bi bi-file-earmark-excel me-1"></i>Excel
      </a>
      <a href="/reports" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Code</th><th>Name</th><th>Batch</th>
            <th>Admission Date</th><th>Status</th><th>Fee Records</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${students}">
            <td><small class="text-muted" th:text="${s.studentCode}"></small></td>
            <td class="fw-semibold">
              <a th:href="@{/students/{id}(id=${s.id})}" class="text-decoration-none" th:text="${s.fullName}"></a>
            </td>
            <td th:text="${s.batch != null ? s.batch.batchName : '—'}"></td>
            <td th:text="${s.admissionDate != null ? #temporals.format(s.admissionDate,'dd MMM yyyy') : '—'}"></td>
            <td>
              <span class="badge"
                    th:classappend="${s.status.name()=='ACTIVE'}?'bg-success':(${s.status.name()=='GRADUATED'}?'bg-info text-dark':'bg-secondary')"
                    th:text="${s.status}"></span>
            </td>
            <td th:text="${#lists.size(s.feePayments)} + ' payments'"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="6" class="text-center text-muted py-3">No students found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Teacher Report</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>Teacher Report</h5>
    <div class="d-flex gap-1">
      <a href="/reports/teachers/export?format=pdf" class="btn btn-sm btn-outline-danger">
        <i class="bi bi-file-earmark-pdf me-1"></i>PDF
      </a>
      <a href="/reports/teachers/export?format=xlsx" class="btn btn-sm btn-outline-success">
        <i class="bi bi-file-earmark-excel me-1"></i>Excel
      </a>
      <a href="/reports" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Code</th><th>Name</th><th>Subject</th><th>Qualification</th>
            <th>Base Salary</th><th>Joining Date</th><th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="t : ${teachers}">
            <td><small class="text-muted" th:text="${t.teacherCode}"></small></td>
            <td class="fw-semibold" th:text="${t.fullName}"></td>
            <td th:text="${t.subject}"></td>
            <td><small th:text="${t.qualification}"></small></td>
            <td th:text="'৳ ' + ${t.baseSalary}"></td>
            <td th:text="${t.joiningDate != null ? #temporals.format(t.joiningDate,'dd MMM yyyy') : '—'}"></td>
            <td>
              <span class="badge"
                    th:classappend="${t.status.name()=='ACTIVE'}?'bg-success':(${t.status.name()=='PROBATION'}?'bg-warning text-dark':'bg-secondary')"
                    th:text="${t.status}"></span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(teachers)}">
            <td colspan="7" class="text-center text-muted py-3">No teachers found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>
</body>
</html>

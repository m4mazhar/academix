<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Teachers</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>Teachers</h5>
    <a href="/teachers/new" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg me-1"></i>Add Teacher
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form th:action="@{/teachers}" method="get" class="row g-2 mb-3">
        <div class="col-md-5">
          <input type="text" name="name" class="form-control" placeholder="Search by name..."
                 th:value="${param.name}">
        </div>
        <div class="col-md-4">
          <select name="status" class="form-select">
            <option value="">All Status</option>
            <option th:each="s : ${T(com.academix.model.enums.TeacherStatus).values()}"
                    th:value="${s}" th:text="${s}"
                    th:selected="${param.status != null && param.status[0] == s.name()}"></option>
          </select>
        </div>
        <div class="col-md-3">
          <button type="submit" class="btn btn-outline-secondary w-100">Search</button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Code</th><th>Name</th><th>Subject</th><th>Phone</th>
              <th>Qualification</th><th>Base Salary</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="t : ${teachers}">
              <td><small class="text-muted" th:text="${t.teacherCode}"></small></td>
              <td class="fw-semibold" th:text="${t.fullName}"></td>
              <td th:text="${t.subject}"></td>
              <td th:text="${t.phone}"></td>
              <td><small th:text="${t.qualification}"></small></td>
              <td th:text="'৳ ' + ${t.baseSalary}"></td>
              <td>
                <span class="badge"
                      th:classappend="${t.status.name()=='ACTIVE'}?'bg-success':(${t.status.name()=='PROBATION'}?'bg-warning text-dark':'bg-secondary')"
                      th:text="${t.status}"></span>
              </td>
              <td class="text-end">
                <a th:href="@{/teachers/{id}/edit(id=${t.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(teachers)}">
              <td colspan="8" class="text-center text-muted py-3">No teachers found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Student Fees</title></head>
<body>
<main>
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0"><i class="bi bi-coin me-2"></i>Student Fees</h5>
    <a href="/fees/new" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg me-1"></i>Record Payment
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form th:action="@{/fees}" method="get" class="row g-2 mb-3">
        <div class="col-md-3">
          <select name="batchId" class="form-select">
            <option value="">All Batches</option>
            <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName}"
                    th:selected="${param.batchId != null && param.batchId[0] == b.id.toString()}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="month" class="form-select">
            <option value="">All Months</option>
            <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}"
                    th:text="${#calendars.format(#calendars.create(2000,m,1),'MMM')}"
                    th:selected="${param.month != null && param.month[0] == m.toString()}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <select name="status" class="form-select">
            <option value="">All Status</option>
            <option th:each="s : ${T(com.academix.model.enums.FeeStatus).values()}"
                    th:value="${s}" th:text="${s}"
                    th:selected="${param.status != null && param.status[0] == s.name()}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-outline-secondary w-100">Filter</button>
        </div>
      </form>

      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
            <tr>
              <th>Receipt#</th><th>Student</th><th>Batch</th><th>Period</th>
              <th>Amount</th><th>Mode</th><th>Status</th><th>Date</th><th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="f : ${fees}">
              <td><small class="text-muted" th:text="${f.receiptNumber}"></small></td>
              <td th:text="${f.student.fullName}"></td>
              <td th:text="${f.batch != null ? f.batch.batchName : '—'}"></td>
              <td th:text="${f.month + '/' + f.year}"></td>
              <td class="fw-semibold" th:text="'৳ ' + ${f.amount}"></td>
              <td th:text="${f.paymentMode}"></td>
              <td>
                <span class="badge"
                      th:classappend="${f.status.name()=='PAID'}?'bg-success':(${f.status.name()=='PENDING'}?'bg-warning text-dark':'bg-danger')"
                      th:text="${f.status}"></span>
              </td>
              <td th:text="${f.paidDate}"></td>
              <td>
                <a th:href="@{/fees/receipt/{id}(id=${f.id})}" class="btn btn-sm btn-outline-secondary">Receipt</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(fees)}">
              <td colspan="9" class="text-center text-muted py-3">No fee records found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
</body>
</html>

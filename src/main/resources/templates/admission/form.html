<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>New Admission</title></head>
<body>
<main>
  <div class="card border-0 shadow-sm" style="max-width:720px">
    <div class="card-header bg-white fw-semibold border-bottom">
      <i class="bi bi-file-earmark-plus me-2"></i>Admission Form
    </div>
    <div class="card-body p-4">
      <form th:action="@{/admissions/save}" th:object="${admission}" method="post">

        <h6 class="text-uppercase text-muted mb-3" style="font-size:11px;letter-spacing:.5px">Student Information</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" th:field="*{fullName}" class="form-control" required
                   th:classappend="${#fields.hasErrors('fullName')}?' is-invalid':''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone *</label>
            <input type="text" th:field="*{phone}" class="form-control" required
                   th:classappend="${#fields.hasErrors('phone')}?' is-invalid':''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Guardian Name</label>
            <input type="text" th:field="*{guardianName}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Guardian Phone</label>
            <input type="text" th:field="*{guardianPhone}" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Date of Birth</label>
            <input type="date" th:field="*{dateOfBirth}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Admission Date</label>
            <input type="date" th:field="*{admissionDate}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Batch *</label>
            <select th:field="*{batchId}" class="form-select" required>
              <option value="">-- Select Batch --</option>
              <option th:each="b : ${batches}" th:value="${b.id}"
                      th:text="${b.batchName + ' (' + (b.subject != null ? b.subject : 'N/A') + ')'}"></option>
            </select>
          </div>
        </div>

        <h6 class="text-uppercase text-muted mb-3" style="font-size:11px;letter-spacing:.5px">Admission Fee</h6>
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Amount (৳)</label>
            <input type="number" step="0.01" th:field="*{admissionFee}" class="form-control" value="0">
          </div>
          <div class="col-md-4">
            <label class="form-label">Remarks</label>
            <input type="text" th:field="*{remarks}" class="form-control">
          </div>
        </div>

        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>Complete Admission
          </button>
          <a href="/dashboard" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

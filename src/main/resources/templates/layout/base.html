<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' — Academix'">Academix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
<div class="d-flex" style="min-height:100vh">
  <!-- ===== SIDEBAR ===== -->
  <nav class="bg-white border-end d-flex flex-column" style="width:250px;min-height:100vh">
    <div class="p-3 border-bottom">
      <span class="fw-semibold h6">
        <i class="bi bi-mortarboard-fill text-primary"></i> Academix
      </span>
    </div>

    <!-- Branch switcher -->
    <div class="px-3 py-2 border-bottom" th:if="${session.currentUser != null && #lists.size(session.currentUser.accessibleBranches) > 1}">
      <form th:action="@{/branch/select}" method="post" class="mb-0">
        <select name="branchId" class="form-select form-select-sm" onchange="this.form.submit()">
          <option th:if="${session.currentUser.superAdmin}" value="" th:selected="${activeBranchId == null}">All branches (HQ)</option>
          <option th:each="b : ${session.currentUser.accessibleBranches}" th:value="${b.id}" th:text="${b.branchName}" th:selected="${activeBranchId == b.id}"></option>
        </select>
      </form>
    </div>

    <ul class="nav flex-column px-2 pt-2 small flex-grow-1">
      <li><span class="text-muted px-2 d-block" style="font-size:10px;text-transform:uppercase;padding:10px 0 4px">Main</span></li>
      <li class="nav-item"><a th:href="@{/dashboard}" class="nav-link rounded" th:classappend="${activeMenu=='dashboard'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a></li>
      <li><span class="text-muted px-2 d-block" style="font-size:10px;text-transform:uppercase;padding:10px 0 4px">Academic</span></li>
      <li class="nav-item"><a th:href="@{/students}" class="nav-link rounded" th:classappend="${activeMenu=='students'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-people me-2"></i>Students</a></li>
      <li class="nav-item"><a th:href="@{/batches}" class="nav-link rounded" th:classappend="${activeMenu=='batches'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-calendar3 me-2"></i>Batches</a></li>
      <li class="nav-item"><a th:href="@{/teachers}" class="nav-link rounded" th:classappend="${activeMenu=='teachers'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-person-badge me-2"></i>Teachers</a></li>
      <li><span class="text-muted px-2 d-block" style="font-size:10px;text-transform:uppercase;padding:10px 0 4px">Finance</span></li>
      <li class="nav-item"><a th:href="@{/admissions/new}" class="nav-link rounded" th:classappend="${activeMenu=='admission'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-file-earmark-plus me-2"></i>Admission</a></li>
      <li class="nav-item"><a th:href="@{/fees}" class="nav-link rounded" th:classappend="${activeMenu=='fees'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-coin me-2"></i>Fees</a></li>
      <li class="nav-item" sec:authorize="hasAnyRole('SUPER_ADMIN','BRANCH_MANAGER','ACCOUNTANT')"><a th:href="@{/payroll}" class="nav-link rounded" th:classappend="${activeMenu=='payroll'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-cash-stack me-2"></i>Payroll</a></li>
      <li class="nav-item" sec:authorize="hasAnyRole('SUPER_ADMIN','BRANCH_MANAGER','ACCOUNTANT')"><a th:href="@{/expenditures}" class="nav-link rounded" th:classappend="${activeMenu=='expenditures'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-receipt me-2"></i>Expenditure</a></li>
      <li><span class="text-muted px-2 d-block" style="font-size:10px;text-transform:uppercase;padding:10px 0 4px">Insights</span></li>
      <li class="nav-item"><a th:href="@{/reports}" class="nav-link rounded" th:classappend="${activeMenu=='reports'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-bar-chart me-2"></i>Reports</a></li>
      <li class="nav-item" sec:authorize="hasRole('SUPER_ADMIN')"><a th:href="@{/admin/branches}" class="nav-link rounded" th:classappend="${activeMenu=='branches'}?' active bg-primary-subtle':' text-secondary'"><i class="bi bi-buildings me-2"></i>Branches</a></li>
    </ul>

    <div class="p-3 border-top small text-muted">
      <sec:authentication property="name" var="uname"/>
      <i class="bi bi-person-circle me-1"></i><span th:text="${uname}"></span>
      <a th:href="@{/logout}" class="ms-2 text-danger text-decoration-none">Logout</a>
    </div>
  </nav>

  <!-- ===== MAIN ===== -->
  <div class="flex-grow-1 d-flex flex-column">
    <header class="bg-white border-bottom px-4 py-2 d-flex align-items-center gap-3">
      <h6 class="mb-0 flex-grow-1 fw-medium" th:text="${pageTitle}">Page</h6>
      <span th:if="${activeBranchName}" class="badge bg-primary-subtle text-primary" th:text="${activeBranchName}"></span>
    </header>

    <main class="flex-grow-1 p-4 bg-light overflow-auto">
      <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      <th:block th:insert="${content}"></th:block>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Students</title></head>
<body>
<main>
  <div class="mb-3">
    <a th:href="@{/students/new}" class="btn btn-primary">
      <i class="bi bi-plus-circle me-2"></i> New Student
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form th:action="@{/students}" method="get" class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" name="name" class="form-control" placeholder="Search by name" th:value="${param.name}">
        </div>
        <div class="col-md-4">
          <select name="batchId" class="form-select">
            <option value="">All Batches</option>
            <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName}"></option>
          </select>
        </div>
        <div class="col-md-4">
          <button type="submit" class="btn btn-outline-secondary w-100">Search</button>
        </div>
      </form>

      <div class="table-responsive" th:if="${#lists.size(students) > 0}">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Phone</th>
              <th>Batch</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="s : ${students}">
              <td><small class="text-muted" th:text="${s.studentCode}"></small></td>
              <td th:text="${s.fullName}"></td>
              <td th:text="${s.phone}"></td>
              <td th:text="${s.batch != null ? s.batch.batchName : '—'}"></td>
              <td><span class="badge bg-success" th:if="${s.status.name() == 'ACTIVE'}" th:text="${s.status}"></span></td>
              <td class="text-end"><a th:href="@{/students/{id}(id=${s.id})}" class="btn btn-sm btn-outline-primary">View</a></td>
            </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${#lists.isEmpty(students)}" class="text-muted mb-0">No students found.</p>
    </div>
  </div>
</main>
</body>
</html>

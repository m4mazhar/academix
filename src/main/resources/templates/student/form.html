<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Student Form</title></head>
<body>
<main>
  <div class="card border-0 shadow-sm" style="max-width:700px">
    <div class="card-body p-4">
      <form th:action="${student.id != null} ? @{/students/{id}/edit(id=${student.id})} : @{/students/save}" method="post" th:object="${student}">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Full Name *</label>
            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Full name of student">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone *</label>
            <input type="tel" th:field="*{phone}" class="form-control" placeholder="Contact number">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Guardian Name</label>
            <input type="text" th:field="*{guardianName}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Guardian Phone</label>
            <input type="tel" th:field="*{guardianPhone}" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <input type="text" th:field="*{address}" class="form-control">
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Date of Birth</label>
            <input type="date" th:field="*{dateOfBirth}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Batch *</label>
            <select th:field="*{batchId}" class="form-select">
              <option value="">Select batch</option>
              <option th:each="b : ${batches}" th:value="${b.id}" th:text="${b.batchName}"></option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-2"></i>Save
          </button>
          <a th:href="@{/students}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

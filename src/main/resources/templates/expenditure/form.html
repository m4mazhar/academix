<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Expense Form</title></head>
<body>
<main>
  <div class="card border-0 shadow-sm" style="max-width:580px">
    <div class="card-header bg-white fw-semibold border-bottom">
      <i class="bi bi-receipt me-2"></i>
      <span th:text="${expenditure.id == null ? 'Add Expense' : 'Edit Expense'}"></span>
    </div>
    <div class="card-body p-4">
      <form th:action="${expenditure.id != null} ? @{/expenditures/{id}/edit(id=${expenditure.id})} : @{/expenditures/save}"
            th:object="${expenditure}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Description *</label>
            <input type="text" th:field="*{description}" class="form-control" required
                   placeholder="e.g. Electricity bill for April"
                   th:classappend="${#fields.hasErrors('description')}?' is-invalid':''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Amount (৳) *</label>
            <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Category *</label>
            <select th:field="*{category}" class="form-select" required>
              <option value="">-- Select Category --</option>
              <option th:each="c : ${T(com.academix.model.enums.ExpenseCategory).values()}"
                      th:value="${c}" th:text="${c}"></option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Date *</label>
            <input type="date" th:field="*{date}" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Voucher Number</label>
            <input type="text" th:field="*{voucherNumber}" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Paid To</label>
            <input type="text" th:field="*{paidTo}" class="form-control">
          </div>
          <div class="col-12">
            <label class="form-label">Approved By</label>
            <input type="text" th:field="*{approvedBy}" class="form-control">
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>Save Expense
          </button>
          <a href="/expenditures" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Branch — Academix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
  <div class="card shadow-sm" style="width:420px">
    <div class="card-body p-4">
      <h5 class="fw-semibold mb-1">
        <i class="bi bi-buildings text-primary"></i> Select Branch
      </h5>
      <p class="text-muted small mb-4">Choose the branch you want to work in.</p>
      <form th:action="@{/branch/select}" method="post">
        <div class="d-grid gap-2">
          <button th:if="${showAll}" name="branchId" value="" class="btn btn-outline-primary text-start">
            <i class="bi bi-globe me-2"></i>All branches (HQ view)
          </button>
          <button th:each="b : ${branches}" th:name="branchId" th:value="${b.id}" class="btn btn-outline-secondary text-start">
            <i class="bi bi-building me-2"></i>
            <span th:text="${b.branchName}"></span>
            <small class="text-muted ms-1" th:text="'· ' + ${b.address}"></small>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

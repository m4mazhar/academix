<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: html(content = ~{::main})">
<head><title>Run Payroll</title></head>
<body>
<main>
  <div class="card border-0 shadow-sm" style="max-width:440px">
    <div class="card-header bg-white fw-semibold border-bottom">
      <i class="bi bi-play-circle me-2"></i>Run Monthly Payroll
    </div>
    <div class="card-body p-4">
      <p class="text-muted small mb-3">
        This will generate payroll entries for all <strong>ACTIVE</strong> teachers
        in the current branch for the selected month and year.
      </p>
      <form th:action="@{/payroll/run}" method="post">
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label">Month *</label>
            <select name="month" class="form-select" required>
              <option value="">Select</option>
              <option th:each="m : ${#numbers.sequence(1,12)}" th:value="${m}"
                      th:text="${#calendars.format(#calendars.create(2000,m,1),'MMMM')}"></option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label">Year *</label>
            <input type="number" name="year" class="form-control" required min="2020" max="2099"
                   th:value="${#dates.year(#dates.createNow())}">
          </div>
        </div>
        <div class="alert alert-warning small mt-3 p-2">
          <i class="bi bi-exclamation-triangle me-1"></i>
          Teachers that already have a payroll entry for this period will be skipped.
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-play-fill me-1"></i>Run Payroll
          </button>
          <a href="/payroll" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</main>
</body>
</html>
